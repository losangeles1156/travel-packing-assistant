<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新旅程準備助手</title>
  <script src="/api/mobile-update.js" defer></script>
  <style>
    body { margin: 0; background: #f4f1e9; color: #344b40; font: 17px/1.6 system-ui, sans-serif; }
    main { box-sizing: border-box; max-width: 32rem; margin: 10vh auto 0; padding: 1.5rem; }
    h1 { font-size: 1.5rem; }
    button { min-height: 48px; padding: 0.6rem 1rem; border: 0; border-radius: 12px; background: #344b40; color: white; font: inherit; }
    button:disabled { opacity: .6; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>更新旅程準備助手</h1>
    <p>請先確認旅程已儲存，再關閉其他「旅程準備」視窗，並保持 USB 連線。</p>
    <button type="button" id="update">檢查並更新</button>
    <p id="status" role="status"></p>
    <a href="/">返回旅程準備助手</a>
  </main>
</body>
</html>
